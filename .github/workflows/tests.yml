name: Testes e integridade

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  testes:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.13"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Instalar Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Instalar dependências
        run: python -m pip install -r requirements.txt
      - name: Testar núcleo criptográfico
        run: python -m unittest discover -v
      - name: Compilar sintaxe
        run: python -m compileall -q app.py securebox_core.py windows_vault.py
